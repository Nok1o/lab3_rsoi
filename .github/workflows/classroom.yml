name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build and run unit tests
        working-directory: backend
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Newman
        run: npm install --global newman@6.2.1

      - uses: docker/setup-buildx-action@v4

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run Redis and PostgreSQL integration tests
        working-directory: backend
        run: >-
          go test -race -count=1
          ./gateway_service/internal/queue
          ./rating_service/internal/repository/postgres
          ./reservation_service/internal/repository/postgres
        env:
          REDIS_TEST_URL: redis://localhost:6379/0
          RATING_TEST_DATABASE_URL: postgres://program:test@localhost:5432/ratings?sslmode=disable
          RESERVATION_TEST_DATABASE_URL: postgres://program:test@localhost:5432/reservations?sslmode=disable

      - name: Run API Tests
        timeout-minutes: 5
        run: ./scripts/test-script.sh
        env:
          VARIANT: v4
          SERVICE_NAME: rating-service
          PORT_NUMBER: '8050'

      - uses: education/autograding@v1
        id: autograder

      # - name: Github auto grader mark
      #   if: ${{ success() && env.GOOGLE_API_KEY != '' }}
      #   uses: Romanow/google-sheet-autograder-marker@v1.0
      #   with:
      #     google_token: ${{secrets.GOOGLE_API_KEY}}
      #     sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
      #     homework_number: 3
      #     user_column: 'D'
      #     column_offset: 'F'
      #     mark: "'+"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v
